<canvas id="c"></canvas>

<script>

function cycleSkin(){do{sk=(sk+1)%SK.length}while(best<SK[sk].m);try{localStorage.setItem('sl_sk',sk)}catch(e){}}

const hs=(a,b)=>(((a*73856093)^(b*19349663))>>>0)%1000/1000;
function reset(){

function gen(){const _r=Math.random;if(daily)Math.random=rnd;try{gen2()}finally{Math.random=_r}}
function gen2(){

// ray vs box; returns entry distance or -1
function rb(ox,oy,dx,dy,r,m){

    else{let a=(lo-o)/d,b=(hi-o)/d;if(a>b)[a,b]=[b,a];tn=Math.max(tn,a);tf=Math.min(tf,b);if(tn>tf)return -1}

    for(const b of B){const t=rb(P.x,P.y,dx,dy,b,bt);if(t>0&&t<bt){bt=t;hp={x:P.x+dx*t,y:P.y+dy*t}}}

function jump(){

}

}
const op=o=>o.t=='w'?[o.x+Math.sin(T*1.7+o.ph)*70,o.y]:[o.x,o.y+Math.sin(T*2+o.ph)*18];

function update(dt){T+=dt;

function sky(){
  const g=ctx.createLinearGradient(0,0,0,vh);const nt=(1-Math.cos(P.max/1500))/2;g.addColorStop(0,mx('#1a1038','#04051a',nt));g.addColorStop(.6,mx('#5a2a5e','#1a1a4a',nt));g.addColorStop(1,mx('#e8704f','#3a2a7a',nt));

  for(let i=1;i<trail.length;i++){ctx.globalAlpha=i/trail.length*.7;ctx.strokeStyle=SK[sk].c;ctx.lineWidth=R*1.6*i/trail.length;
    ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke()}
  ctx.globalAlpha=1;if(hook){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(hook.x,hook.y);ctx.stroke();
    ctx.fillStyle='#7ae0ff';ctx.beginPath();ctx.arc(hook.x,hook.y,4,0,7);ctx.fill()}
  ctx.fillStyle=SK[sk].c;ctx.beginPath();ctx.arc(P.x,P.y,R,0,7);ctx.fill();
  ctx.fillStyle='#fff';const ra=(P.rot||0)-.8;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(P.x+Math.cos(ra)*5,P.y+Math.sin(ra)*5,3.2,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(P.x+Math.cos(ra)*6,P.y+Math.sin(ra)*6,1.4,0,7);ctx.fill();
  ctx.restore();
  $('st').textContent=`x${Math.min(cmb,10)||1} · ${pts} pts · ${coins} coins · ⚡${Math.round(meter*100)}%`+(Math.abs(windF)>60?(windF>0?' · wind →':' · wind ←'):'');
  const nl=SK.find(s=>best<s.m);$('b1').textContent='Daily: '+(daily?'on':'off')+' (C)';$('b2').textContent='Skin: '+SK[sk].n+(nl?' · next at '+nl.m+' m':'')+' (K)';
  $('d').textContent=Math.floor(P.max/10);$('v').textContent=Math.round(Math.hypot(P.vx,P.vy)/10);$('b').textContent=best;
  $('msg').innerHTML=state=='dead'?`<b>${cause} at ${Math.floor(P.max/10)} m</b>${cp?'Tap: resume at checkpoint &middot; R: restart':'Tap or press R to go again'}`:
    hint>0?`<b>Slingline</b>Hold click / touch to fire a hook toward the pointer, release to fling.<br>A/D run &middot; Space jump &middot; S reel in faster<br>Green rooftops bounce you. Spikes, mines and saws are deadly.<br>E spin &middot; Q boost &middot; hold toward a wall to wall-run &middot; hold S to slide<br>K skin &middot; C daily &middot; M mute`:cpT>0?'<b>Checkpoint!</b>':'';
}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
function down(e){ensureAudio();
  mouse.x=e.clientX;mouse.y=e.clientY;
  if(state=='dead'){if(tDead>.5)cp?respawn():reset();return}
  fire(mouse.x/S+cam.x,mouse.y/S+cam.y);
  if(P.gt>0||P.wt>0)jump();
}
cv.addEventListener('pointerdown',down);
cv.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
const up=()=>{if(coarse&&hook&&meter>=.5)boost();hook=null};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  keys[e.key.length==1?e.key.toLowerCase():e.key]=1;ensureAudio();
  if(e.key=='q')boost();if(e.key=='k')cycleSkin();if(e.key=='c')toggleDaily();if(e.key=='m')mute=!mute;
  if(e.key==' '||e.key=='w'||e.key=='ArrowUp'){e.preventDefault();if(state=='play')jump()}
  if(e.key=='r')reset();else if(e.key==' '&&state=='dead'&&tDead>.5)cp?respawn():reset();
});
addEventListener('keyup',e=>{keys[e.key.length==1?e.key.toLowerCase():e.key]=0});
$('b1').onclick=toggleDaily;$('b2').onclick=cycleSkin;$('b1').onmousedown=$('b2').onmousedown=e=>e.preventDefault();
reset();requestAnimationFrame(loop);
</script></body></html>
