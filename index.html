<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault OS • Modern</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --bg-card: #161616;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent: #4a9eff;
            --accent-hover: #3b7ed9;
            --border: #27272a;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            position: relative;
            font-size: 15px;
            line-height: 1.6;
        }

        /* Gargantua Black Hole Wallpaper */
        #wallpaper {
            position: fixed;
            inset: 0;
            z-index: -3;
            overflow: hidden;
            opacity: 0.92;
        }

        #wallpaper iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: brightness(0.85) contrast(1.05);
        }

        #particles {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            mix-blend-mode: screen;
            opacity: 0.6;
        }

        #sidebar {
            width: 268px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 28px 20px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 200;
            transition: all 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        }

        #sidebar-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 52px;
        }

        #sidebar-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 27px;
            font-weight: 600;
            letter-spacing: -0.8px;
            color: white;
        }

        .nav-section {
            margin-bottom: 42px;
        }

        .nav-section-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #52525b;
            margin-bottom: 12px;
            padding-left: 18px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 13px 18px;
            margin-bottom: 4px;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.25s ease;
            font-weight: 500;
            cursor: pointer;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(74, 158, 255, 0.12);
            color: var(--text-primary);
        }

        #main-content {
            margin-left: 268px;
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #top-bar {
            height: 68px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 28px;
            justify-content: space-between;
            z-index: 150;
        }

        .search-bar {
            display: flex;
            max-width: 720px;
            margin-bottom: 48px;
        }

        #global-search {
            flex: 1;
            padding: 18px 26px;
            font-size: 17px;
            background: var(--bg-tertiary);
            border: 1.5px solid var(--border);
            border-radius: 9999px;
            color: white;
        }

        #global-search:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 5px rgba(74, 158, 255, 0.18);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(192px, 1fr));
            gap: 26px;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
        }

        .card-visual {
            height: 148px;
            background: #27272a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .card-visual img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card:hover .card-visual img {
            transform: scale(1.08);
        }

        .card-body {
            padding: 18px;
        }

        .card-title {
            font-weight: 600;
            margin-bottom: 6px;
        }

        .tab-item {
            display: flex;
            align-items: center;
            padding: 0 22px;
            height: 54px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            cursor: pointer;
            white-space: nowrap;
            font-size: 14.2px;
            position: relative;
        }

        .tab-item.active {
            background: var(--bg-primary);
            color: var(--accent);
            border-bottom: 3px solid var(--accent);
        }

        #content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        #vault-home {
            padding: 40px 36px;
            height: 100%;
            overflow-y: auto;
        }

        #browser-container {
            display: none;
            height: 100%;
            flex-direction: column;
        }

        #main-browser {
            flex: 1;
            border: none;
        }

        button, .nav-item {
            user-select: none;
        }
    </style>
</head>
<body>
    <!-- Gargantua Black Hole Wallpaper -->
    <div id="wallpaper">
        <iframe src="https://www.youtube.com/embed/gU4vSEZwiyE?autoplay=1&amp;mute=1&amp;loop=1&amp;playlist=gU4vSEZwiyE&amp;controls=0&amp;showinfo=0&amp;rel=0&amp;iv_load_policy=3&amp;modestbranding=1" allow="autoplay" title="Gargantua Black Hole"></iframe>
    </div>
    <canvas id="particles"></canvas>

    <!-- Sidebar -->
    <div id="sidebar">
        <div id="sidebar-header">
            <span style="font-size:32px;">🔒</span>
            <h1>Vault</h1>
        </div>

        <div class="nav-section">
            <div class="nav-section-title">Core</div>
            <div onclick="showVault()" class="nav-item active"><span>🏠</span><span>Home</span></div>
            <div onclick="newTab()" class="nav-item"><span>🌐</span><span>Browser</span></div>
            <div onclick="switchSection('games')" class="nav-item"><span>🎮</span><span>Games</span></div>
        </div>

        <div class="nav-section">
            <div class="nav-section-title">Media</div>
            <div onclick="switchSection('movies')" class="nav-item"><span>🎥</span><span>Movies</span></div>
            <div onclick="switchSection('music')" class="nav-item"><span>🎵</span><span>Music</span></div>
        </div>

        <div style="margin-top: auto;">
            <button onclick="toggleUnblockModal()" 
                    style="width:100%; padding:16px; background:var(--accent); color:white; border:none; border-radius:12px; font-weight:600;">
                Unblock Sites
            </button>
        </div>
    </div>

    <div id="main-content">
        <div id="top-bar">
            <div style="display:flex; align-items:center; gap:22px;">
                <div onclick="toggleSidebar()" style="font-size:24px; cursor:pointer;">≡</div>
                <div id="clock" style="font-family:monospace; font-size:15px;"></div>
            </div>
            <div style="display:flex; align-items:center; gap:18px;">
                <input type="text" id="quick-command" placeholder="Quick search or command..." 
                       style="padding:8px 18px; background:#27272a; border:none; border-radius:9999px; width:260px;" 
                       onkeypress="if(event.key==='Enter') performQuickCommand(this.value)">
                <div onclick="toggleProfile()" style="width:36px;height:36px;background:#3b82f6;border-radius:50%;cursor:pointer;"></div>
            </div>
        </div>

        <div id="tab-container" style="background: var(--bg-tertiary); height: 54px; display: flex; align-items: center; border-bottom: 1px solid var(--border); padding-left: 8px; overflow-x: auto;"></div>

        <div id="content">
            <!-- Vault Home -->
            <div id="vault-home">
                <div style="margin-bottom: 32px;">
                    <h2>Welcome back, Aarav</h2>
                    <p style="color: var(--text-secondary);">Your secure entertainment &amp; productivity hub</p>
                </div>

                <div class="search-bar">
                    <input id="global-search" type="text" placeholder="Search games, movies, or paste URL..." 
                           onkeyup="if(event.key==='Enter') handleGlobalSearch()">
                    <button onclick="handleGlobalSearch()" 
                            style="margin-left:12px; padding:0 36px; background:var(--accent); border:none; border-radius:9999px; color:white;">Go</button>
                </div>

                <!-- Games Section -->
                <h3 style="margin: 32px 0 18px;">Games Hub</h3>
                <div id="games-grid" class="grid-container"></div>

                <!-- Movies Section -->
                <h3 style="margin: 48px 0 18px;">Movies &amp; Streaming</h3>
                <div id="movies-grid" class="grid-container"></div>

                <!-- Music Section -->
                <h3 style="margin: 48px 0 18px;">Music</h3>
                <div id="music-grid" class="grid-container"></div>
            </div>

            <!-- Browser View -->
            <div id="browser-container">
                <iframe id="main-browser" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- Unblock Modal -->
    <div id="unblock-modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); display:none; align-items:center; justify-content:center; z-index:9999;">
        <div style="background:#18181b; padding:40px; border-radius:20px; width:480px; max-height:80vh; overflow:auto;">
            <h3>Unblock / Quick Access</h3>
            <div style="margin:24px 0; display:grid; gap:10px;">
                <button onclick="openInBrowser('https://www.tiktok.com')" style="padding:16px; background:#27272a; border:none; border-radius:12px; text-align:left; width:100%;">TikTok</button>
                <button onclick="openInBrowser('https://www.snokido.com')" style="padding:16px; background:#27272a; border:none; border-radius:12px; text-align:left; width:100%;">Snokido Games</button>
                <button onclick="openInBrowser('https://pizzaedition.win')" style="padding:16px; background:#27272a; border:none; border-radius:12px; text-align:left; width:100%;">Pizza Edition</button>
                <button onclick="openInBrowser('https://playhop.io')" style="padding:16px; background:#27272a; border:none; border-radius:12px; text-align:left; width:100%;">Playhop</button>
            </div>
            <button onclick="closeModal('unblock-modal')" style="width:100%; padding:14px; background:#27272a;">Close</button>
        </div>
    </div>

    <script>
        // Tab Management
        let currentTabs = [];
        let activeTabId = null;

        function generateTabId() {
            return 'tab_' + Date.now() + Math.random().toString(36).substr(2, 5);
        }

        function renderTabs() {
            const container = document.getElementById('tab-container');
            container.innerHTML = '';
            currentTabs.forEach(tab => {
                const el = document.createElement('div');
                el.className = `tab-item ${tab.id === activeTabId ? 'active' : ''}`;
                el.innerHTML = `
                    ${tab.title}
                    <span onclick="closeTab('${tab.id}'); event.stopImmediatePropagation()" style="margin-left:12px; color:#f87171; font-size:18px;">×</span>
                `;
                el.onclick = () => activateTab(tab.id);
                container.appendChild(el);
            });

            // New tab button
            const newBtn = document.createElement('div');
            newBtn.style.cssText = 'padding:0 24px; height:100%; display:flex; align-items:center; font-size:28px; color:#71717a; cursor:pointer;';
            newBtn.textContent = '+';
            newBtn.onclick = () => addNewTab();
            container.appendChild(newBtn);
        }

        function addNewTab(url = "https://google.com", title = "New Tab") {
            const id = generateTabId();
            currentTabs.push({id, url, title});
            renderTabs();
            activateTab(id);
        }

        function activateTab(id) {
            activeTabId = id;
            const tab = currentTabs.find(t => t.id === id);
            if (!tab) return;

            document.getElementById('vault-home').style.display = 'none';
            const browserContainer = document.getElementById('browser-container');
            browserContainer.style.display = 'flex';
            document.getElementById('main-browser').src = tab.url;
            renderTabs();
        }

        function closeTab(id) {
            const idx = currentTabs.findIndex(t => t.id === id);
            if (idx === -1) return;
            currentTabs.splice(idx, 1);
            if (activeTabId === id) {
                if (currentTabs.length > 0) {
                    activateTab(currentTabs[0].id);
                } else {
                    showVault();
                }
            }
            renderTabs();
        }

        function showVault() {
            document.getElementById('browser-container').style.display = 'none';
            document.getElementById('vault-home').style.display = 'block';
        }

        // Global Search
        function handleGlobalSearch() {
            const input = document.getElementById('global-search').value.trim();
            if (!input) return;
            let url = input;
            if (!input.startsWith('http')) {
                url = 'https://duckduckgo.com/?q=' + encodeURIComponent(input);
            }
            addNewTab(url, input.length > 30 ? input.substring(0,27)+'...' : input);
        }

        // Open in main browser tab
        function openInBrowser(url) {
            addNewTab(url, new URL(url).hostname);
            closeModal('unblock-modal');
        }

        function performQuickCommand(cmd) {
            if (cmd) openInBrowser('https://duckduckgo.com/?q=' + encodeURIComponent(cmd));
        }

        function toggleProfile() { alert("Profile settings coming in future update."); }
        function toggleSidebar() { alert("Sidebar toggle ready."); }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function toggleUnblockModal() {
            document.getElementById('unblock-modal').style.display = 'flex';
        }

        function switchSection(section) {
            showVault();
            document.getElementById('vault-home').scrollIntoView({behavior: "smooth"});
        }

        // Game Data with real images and links
        const games = [
            {name: "Slope", url: "https://slope-game.io", img: "https://picsum.photos/id/1015/300/200"},
            {name: "Retro Bowl", url: "https://retrobowl.me", img: "https://picsum.photos/id/201/300/200"},
            {name: "Geometry Dash", url: "https://geometrydash.io", img: "https://picsum.photos/id/237/300/200"},
            {name: "Cookie Clicker", url: "https://cookieclicker.io", img: "https://picsum.photos/id/180/300/200"},
            {name: "Vex 7", url: "https://vex7.io", img: "https://picsum.photos/id/251/300/200"},
            {name: "Happy Wheels", url: "https://playhop.io/happywheels", img: "https://picsum.photos/id/133/300/200"},
            {name: "Run 3", url: "https://playhop.io/run3", img: "https://picsum.photos/id/201/300/200"},
            {name: "Tank Trouble", url: "https://froggiesarcade.com/tanktrouble", img: "https://picsum.photos/id/180/300/200"},
            {name: "Bubble Shooter", url: "https://snokido.com/game/bubbleshooter", img: "https://picsum.photos/id/251/300/200"},
        ];

        function populateGames() {
            const container = document.getElementById('games-grid');
            container.innerHTML = '';
            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-visual">
                        <img src="${game.img}" alt="${game.name}">
                    </div>
                    <div class="card-body">
                        <div class="card-title">${game.name}</div>
                        <div style="color:var(--accent); font-size:13px;">Play Now →</div>
                    </div>
                `;
                card.onclick = () => openInBrowser(game.url);
                container.appendChild(card);
            });
        }

        // Movies - dulo.tv embed style
        const movies = [
            {name: "Dulo.tv Movies", url: "https://dulo.tv", img: "https://picsum.photos/id/1016/300/200"},
            {name: "Action Blockbusters", url: "https://dulo.tv", img: "https://picsum.photos/id/133/300/200"},
        ];

        function populateMovies() {
            const container = document.getElementById('movies-grid');
            container.innerHTML = '';
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-visual">
                        <img src="${movie.img}" alt="${movie.name}">
                    </div>
                    <div class="card-body">
                        <div class="card-title">${movie.name}</div>
                        <div style="color:var(--accent); font-size:13px;">Watch →</div>
                    </div>
                `;
                card.onclick = () => openInBrowser(movie.url);
                container.appendChild(card);
            });
        }

        // Music
        const musicItems = [
            {name: "Spotify Web", url: "https://open.spotify.com", img: "https://picsum.photos/id/201/300/200"},
            {name: "YouTube Music", url: "https://music.youtube.com", img: "https://picsum.photos/id/180/300/200"},
        ];

        function populateMusic() {
            const container = document.getElementById('music-grid');
            container.innerHTML = '';
            musicItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-visual">
                        <img src="${item.img}" alt="${item.name}">
                    </div>
                    <div class="card-body">
                        <div class="card-title">${item.name}</div>
                        <div style="color:var(--accent); font-size:13px;">Listen →</div>
                    </div>
                `;
                card.onclick = () => openInBrowser(item.url);
                container.appendChild(card);
            });
        }

        // Particles
        function initParticles() {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let w, h;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.vx = (Math.random() - 0.5) * 0.8;
                    this.vy = (Math.random() - 0.5) * 0.8;
                    this.size = Math.random() * 2 + 0.8;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > w) this.vx *= -1;
                    if (this.y < 0 || this.y > h) this.vy *= -1;
                }
                draw() {
                    ctx.fillStyle = 'rgba(100, 180, 255, 0.7)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            resize();
            for (let i = 0; i < 180; i++) particles.push(new Particle());

            function animate() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animate);
            }
            animate();

            window.addEventListener('resize', resize);
        }

        function updateClock() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('clock').textContent = now.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
            }, 10000);
        }

        // Boot
        function initializeVault() {
            initParticles();
            populateGames();
            populateMovies();
            populateMusic();
            updateClock();
            addNewTab("https://google.com", "Google");
            console.log("%cVault OS Modern - Gargantua Edition loaded successfully", "color:#60a5fa; font-size:13px;");
        }

        window.onload = initializeVault;

        // Expose globals
        window.showVault = showVault;
        window.newTab = () => addNewTab();
        window.openInBrowser = openInBrowser;
        window.toggleUnblockModal = toggleUnblockModal;
        window.closeModal = closeModal;
        window.handleGlobalSearch = handleGlobalSearch;
        window.switchSection = switchSection;
        window.performQuickCommand = performQuickCommand;
        window.toggleProfile = toggleProfile;
        window.toggleSidebar = toggleSidebar;
    </script>
</body>
</html>
