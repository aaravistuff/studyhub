<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aarav's Vault — Web OS</title>
<!-- Styles for the entire UI -->
<style>
  /* Reset and base styles */
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #121212;
    color: #fff;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Sidebar */
#sidebar {
    width: 250px;
    background: #222;
    display: flex;
    flex-direction: column;
    padding: 20px;
    position: fixed;
    height: 100%;
    top: 0;
    left: 0;
    z-index: 999;
  }

#sidebar h1 {
    font-size: 1.8rem;
    margin-bottom: 20px;
}

.nav-button {
    background: #333;
    border: none;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    transition: background 0.2s;
}
.nav-button:hover, .nav-button.active {
    background: #555;
}

/* Main area */
#main {
    margin-left: 250px;
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
}

/* Top tabs (search results / browser tabs) */
#tabs {
    display: flex;
    background: #1f1f1f;
    padding: 4px;
    overflow-x: auto;
    align-items: center;
}
#tabs button {
    background: #444;
    border: none;
    padding: 8px 12px;
    margin-right: 8px;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
}
#tabs button.active {
    background: #666;
}
#tabs #newtab {
    background: #333;
    font-weight: bold;
}
#browserContainer {
    flex: 1;
    position: relative;
    display: none; /* Hidden initially, shown when browsing */
}
#browser {
    width: 100%;
    height: 100%;
    border: none;
}
#vault {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: 20px;
    height: 100%;
    overflow: auto;
}
/* Search box styling */
#searchBox {
    width: 100%;
    max-width: 700px;
    margin-bottom: 20px;
}
#searchInput {
    width: 100%;
    padding: 12px 20px;
    font-size: 1rem;
    border-radius: 8px;
    border: none;
    outline: none;
}
#searchButton {
    padding: 12px 20px;
    margin-top: 10px;
    font-size: 1rem;
    border-radius: 8px;
    border: none;
    background: #ff7b00;
    color: #fff;
    cursor: pointer;
}
#searchButton:hover {
    background: #ff9b40;
}

/* Unblock TikTok buttons container */
#unblockButtons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 10px;
}
.unblock-btn {
    background: #222;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    color: #fff;
    cursor: pointer;
    font-size: 0.9rem;
}
.unblock-btn:hover {
    background: #444;
}

/* Style for the "Unblock Sites" button in the sidebar */
#unblockBtn {
    margin-top: 20px;
    padding: 12px;
    background: #ff7b00;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
}
#unblockBtn:hover {
    background: #ff9b40;
}
</style>
</head>
<body>

<!-- Sidebar navigation -->
<div id="sidebar">
    <h1>Vault OS</h1>
    <button class="nav-button" data-view="home">Home Workspace</button>
    <button class="nav-button" data-view="cafe">Cinema Hub</button>
    <button class="nav-button" data-view="arcade">Arcade Vault</button>
    <button id="unblockBtn">Unblock Sites</button>
</div>

<!-- Main content -->
<div id="main">

    <!-- Top tabs for browsing or open tabs -->
    <div id="tabs">
        <button id="newTabBtn" title="New Tab">+ New Tab</button>
    </div>

    <!-- Container for browser or vault -->
    <div id="browserContainer">
        <!-- Browser iframe -->
        <iframe id="browser" src=""></iframe>
        <!-- Vault (search page) -->
        <div id="vault">
            <div id="searchBox">
                <input type="text" id="searchInput" placeholder="Search or enter URL" />
                <button id="searchButton">Go</button>
            </div>
            <div id="unblockButtons">
                <button class="unblock-btn" onclick="openUnblockedSite('https://www.tiktok.com')">TikTok Main</button>
                <button class="unblock-btn" onclick="openUnblockedSite('https://vt.tiktok.com')">TikTok Vt</button>
                <button class="unblock-btn" onclick="openUnblockedSite('https://tiktok.com')">TikTok Com</button>
                <!-- Add more unblock buttons if needed -->
            </div>
        </div>
    </div>

</div>

<script>
const views = {
    home: document.querySelector('#vault'),
    cafe: document.querySelector('#vault'), // For simplicity, reuse vault for other views
    arcade: document.querySelector('#vault')
};
let currentView = 'home';

// Elements
const searchInput = document.getElementById('searchInput');
const searchButton = document.getElementById('searchButton');
const browser = document.getElementById('browser');
const vault = document.getElementById('vault');
const browserContainer = document.getElementById('browserContainer');
const tabsDiv = document.getElementById('tabs');
const newTabBtn = document.getElementById('newTabBtn');

// Manage browser tabs
let tabs = [];
let currentTab = null;

// Function to create a new tab
function createTab(url = 'https://google.com', title = 'New Tab') {
    const tab = { url, title, id: Date.now() };
    tabs.push(tab);
    addTabButton(tab);
    switchTab(tab.id);
}

// Function to add tab button
function addTabButton(tab) {
    const btn = document.createElement('button');
    btn.innerText = tab.title;
    btn.dataset.id = tab.id;
    btn.title = tab.url;
    btn.onclick = () => switchTab(tab.id);
    // Add close button
    const closeBtn = document.createElement('span');
    closeBtn.innerText = ' ✕';
    closeBtn.style.marginLeft = '4px';
    closeBtn.style.cursor = 'pointer';
    closeBtn.onclick = (e) => {
        e.stopPropagation();
        closeTab(tab.id);
    };
    btn.appendChild(closeBtn);
    // Insert before the + button
    if (tabsDiv.children.length > 1) {
        tabsDiv.insertBefore(btn, newTabBtn);
    } else {
        tabsDiv.appendChild(btn);
    }
}

// Switch to a tab
function switchTab(id) {
    currentTab = tabs.find(t => t.id == id);
    if (currentTab) {
        browser.src = currentTab.url;
        // Highlight active tab
        Array.from(tabsDiv.children).forEach(b => {
            if (b.dataset.id == id) {
                b.classList.add('active');
            } else {
                b.classList.remove('active');
            }
        });
    }
}

// Close tab
function closeTab(id) {
    tabs = tabs.filter(t => t.id != id);
    // Remove tab button
    Array.from(tabsDiv.children).forEach(b => {
        if (b.dataset.id == id) b.remove();
    });
    // Switch to another tab if current closed
    if (currentTab && currentTab.id == id && tabs.length > 0) {
        switchTab(tabs[0].id);
    } else if (tabs.length == 0) {
        // No tabs, show vault
        showVault();
    }
}

// Add initial tab
createTab();

// Handle search
searchButton.onclick = handleSearch;
searchInput.onkeydown = (e) => { if (e.key === 'Enter') handleSearch(); };

function handleSearch() {
    const query = searchInput.value.trim();
    if (!query) return;
    // If URL pattern
    const urlPattern = /^https?:\/\//i;
    let url = query;
    if (!urlPattern.test(query)) {
        // treat as search
        url = 'https://duckduckgo.com/?q=' + encodeURIComponent(query);
    }
    // Open in current tab or new tab
    if (currentTab) {
        currentTab.url = url;
        switchTab(currentTab.id);
    } else {
        createTab(url);
    }
    // Switch view to browser
    showBrowser();
}

// Show browser view
function showBrowser() {
    document.querySelector('#browser').src = currentTab ? currentTab.url : '';
    document.getElementById('browser').parentElement.style.display = 'block';
    document.querySelector('#vault').style.display = 'none';
    currentView = 'browser';
    updateTabsDisplay();
}

// Show vault view
function showVault() {
    document.querySelector('#browser').parentElement.style.display = 'none';
    document.querySelector('#vault').style.display = 'flex';
    currentView = 'vault';
    updateTabsDisplay();
}

// Update tabs display
function updateTabsDisplay() {
    // Highlight active tab
    Array.from(tabsDiv.children).forEach(b => {
        b.classList.toggle('active', b.dataset.id == currentTab?.id);
    });
}

// Handle search button
function handleSearch() {
    const query = searchInput.value.trim();
    if (!query) return;
    // If URL pattern
    const urlPattern = /^https?:\/\//i;
    let url = query;
    if (!urlPattern.test(query)) {
        // treat as search
        url = 'https://duckduckgo.com/?q=' + encodeURIComponent(query);
    }
    // Open in current tab or new tab
    if (currentTab) {
        currentTab.url = url;
        switchTab(currentTab.id);
    } else {
        createTab(url);
    }
    // Switch to browser view
    showBrowser();
}

// Handle tab creation
newTabBtn.onclick = () => {
    createTab();
};

// Function to switch to a tab by id
function switchTab(id) {
    const tab = tabs.find(t => t.id == id);
    if (tab) {
        currentTab = tab;
        document.querySelector('#browser').src = tab.url;
        updateTabsDisplay();
    }
}

// Function to close a tab
function closeTab(id) {
    tabs = tabs.filter(t => t.id != id);
    // Remove button
    Array.from(tabsDiv.children).forEach(b => {
        if (b.dataset.id == id) b.remove();
    });
    if (currentTab?.id == id) {
        if (tabs.length > 0) {
            switchTab(tabs[0].id);
        } else {
            showVault();
        }
    }
}

// Initialize first tab
// (already called in createTab())

// Handle view switching
document.querySelectorAll('.nav-button').forEach(btn => {
    btn.onclick = () => {
        const view = btn.dataset.view;
        document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (view === 'home') {
            showVault();
        } else {
            showVault(); // For simplicity, same vault for all views
        }
    };
});

// Show vault (search page)
function showVault() {
    document.querySelector('#browser').parentElement.style.display = 'none';
    document.querySelector('#vault').style.display = 'flex';
    currentView = 'vault';
    updateTabsDisplay();
}

// Show browser with current tab
function showBrowser() {
    document.querySelector('#browser').parentElement.style.display = 'block';
    document.querySelector('#vault').style.display = 'none';
    currentView = 'browser';
    if (currentTab) {
        document.querySelector('#browser').src = currentTab.url;
    }
}

// Handle search button click
document.getElementById('searchButton').onclick = handleSearch;
searchInput.onkeydown = (e) => { if (e.key === 'Enter') handleSearch(); };

// Unblock sites buttons
function openUnblockedSite(url) {
    window.open(url, '_blank');
}

// Unblock sites button in sidebar
document.getElementById('unblockBtn').onclick = () => {
    alert('Use the buttons above to unblock TikTok sites.');
};

// Unblock buttons in the vault
// (Already in HTML, handled by onclicks)

// When page loads
window.onload = () => {
    // Load previous tabs if any
    const savedTabs = JSON.parse(localStorage.getItem('tabs'));
    if (savedTabs && Array.isArray(savedTabs)) {
        savedTabs.forEach(t => {
            createTab(t.url, t.title);
        });
        if (savedTabs.length > 0) {
            switchTab(savedTabs[0].id);
        }
    } else {
        createTab(); // default tab
    }
    showVault();
}
</script>
</body>
</html>
