<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --accent: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            color: white;
            background: #000;
            display: flex;
        }

        /* Gargantua Wallpaper */
        #wallpaper {
            position: fixed;
            inset: 0;
            z-index: -3;
            overflow: hidden;
        }
        #wallpaper iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: brightness(0.78) contrast(1.12) saturate(1.1);
        }

        /* Sidebar - Exact Polaris Style */
        #sidebar {
            width: 260px;
            background: linear-gradient(to bottom, rgba(15,23,42,0.98), rgba(15,23,42,0.95));
            backdrop-filter: blur(16px);
            border-right: 1px solid #334155;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
            height: 100vh;
        }

        .logo {
            padding: 0 24px 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 26px;
            font-weight: 700;
        }

        .nav-header {
            padding: 0 24px 8px;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            color: #cbd5e1;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(245, 158, 11, 0.18);
            color: white;
        }
        .nav-item img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        /* Main Content */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #top-right {
            position: absolute;
            top: 28px;
            right: 40px;
            text-align: right;
            z-index: 50;
        }
        #top-right .day {
            font-size: 42px;
            font-weight: 500;
            line-height: 1;
        }
        #top-right .hub {
            font-size: 15px;
            color: #cbd5e1;
        }

        #search-bar {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 620px;
            z-index: 60;
        }
        #global-search {
            width: 100%;
            padding: 18px 28px 18px 56px;
            font-size: 17px;
            background: rgba(30, 41, 59, 0.85);
            border: 2px solid #475569;
            border-radius: 9999px;
            color: white;
            backdrop-filter: blur(12px);
        }
        #global-search:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 5px rgba(245, 158, 11, 0.25);
        }

        .category-pills {
            position: absolute;
            top: 200px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(15,23,42,0.7);
            padding: 6px;
            border-radius: 9999px;
            z-index: 50;
        }
        .pill {
            padding: 8px 24px;
            border-radius: 9999px;
            font-size: 14.5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pill.active {
            background: var(--accent);
            color: black;
            font-weight: 600;
        }

        /* Apps Grid */
        #apps-grid {
            position: absolute;
            top: 280px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(7, 110px);
            gap: 32px 24px;
            z-index: 40;
        }
        .app-card {
            text-align: center;
            cursor: pointer;
            transition: transform 0.25s ease;
        }
        .app-card:hover {
            transform: scale(1.12);
        }
        .app-icon {
            width: 82px;
            height: 82px;
            border-radius: 18px;
            margin: 0 auto 10px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .app-name {
            font-size: 13.5px;
            font-weight: 500;
        }

        /* Bottom Bar */
        #bottom-bar {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15,23,42,0.85);
            backdrop-filter: blur(12px);
            padding: 8px 20px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 18px;
            z-index: 70;
        }

        /* Browser */
        #browser-container {
            display: none;
            flex-direction: column;
            height: 100%;
            position: absolute;
            inset: 0;
            z-index: 100;
            background: #000;
        }
        #main-browser { flex: 1; border: none; }

        .tab-bar {
            height: 52px;
            background: #1e2937;
            display: flex;
            align-items: center;
            padding: 0 12px;
            overflow-x: auto;
        }
        .tab {
            padding: 0 22px;
            height: 100%;
            display: flex;
            align-items: center;
            background: #334155;
            margin-right: 4px;
            border-radius: 8px 8px 0 0;
            white-space: nowrap;
            cursor: pointer;
        }
        .tab.active { background: #0f172a; }
    </style>
</head>
<body>
    <!-- Black Hole Wallpaper -->
    <div id="wallpaper">
        <iframe src="https://www.youtube.com/embed/gU4vSEZwiyE?autoplay=1&amp;mute=1&amp;loop=1&amp;playlist=gU4vSEZwiyE&amp;controls=0&amp;showinfo=0&amp;rel=0" allow="autoplay" title="Gargantua Black Hole"></iframe>
    </div>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="logo">
            <span style="font-size:32px;">🔒</span>
            <span>Vault OS</span>
        </div>

        <div class="nav-item active" onclick="navigateTo('home')"><span>🏠</span> Home</div>

        <div class="nav-header">ENTERTAINMENT</div>
        <div class="nav-item" onclick="navigateTo('cinema')"><span>🎥</span> Cinema</div>
        <div class="nav-item" onclick="navigateTo('music')"><span>🎵</span> Music</div>
        <div class="nav-item" onclick="navigateTo('games')"><span>🎮</span> Games</div>
        <div class="nav-item"><span>🕹️</span> Emulator</div>
        <div class="nav-item"><span>🔊</span> Soundboard</div>
        <div class="nav-item"><span>📜</span> My List</div>

        <div class="nav-header" style="margin-top:40px;">TOOLS</div>
        <div class="nav-item" onclick="newBrowserTab()"><span>🌐</span> Browser</div>

        <div style="margin-top:auto;padding:0 24px 30px;">
            <button onclick="toggleUnblockModal()" 
                    style="width:100%;padding:14px 20px;background:#334155;border:none;border-radius:9999px;color:white;font-weight:500;">
                Unblock Sites
            </button>
        </div>
    </div>

    <div id="main">
        <!-- Top Right Info -->
        <div id="top-right">
            <div class="day">Sunday</div>
            <div class="hub">VAULT OS<br>Your cinematic web hub</div>
        </div>

        <!-- Search -->
        <div id="search-bar">
            <input id="global-search" type="text" placeholder="Search the web or enter a URL" 
                   onkeypress="if(event.key==='Enter') handleSearch()">
        </div>

        <!-- Category Pills -->
        <div class="category-pills">
            <div class="pill active" onclick="filterCategory(this)">Popular</div>
            <div class="pill" onclick="filterCategory(this)">Games</div>
            <div class="pill" onclick="filterCategory(this)">Websites</div>
            <div class="pill" onclick="filterCategory(this)">Media</div>
        </div>

        <!-- Apps Grid -->
        <div id="apps-grid"></div>

        <!-- Bottom Bar -->
        <div id="bottom-bar">
            <span style="font-size:22px;cursor:pointer;" onclick="newBrowserTab()">🌐</span>
            <span style="color:#94a3b8;">•</span>
            <span id="clock" style="font-size:15px;min-width:80px;"></span>
        </div>
    </div>

    <!-- Browser Container -->
    <div id="browser-container">
        <div class="tab-bar" id="tab-bar"></div>
        <iframe id="main-browser" allowfullscreen></iframe>
    </div>

    <!-- Modal -->
    <div id="unblock-modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:200;">
        <div style="background:#1e2937;padding:40px;border-radius:20px;width:460px;">
            <h3>Unblock Quick Links</h3>
            <div id="modal-content" style="margin:25px 0;display:flex;flex-direction:column;gap:12px;"></div>
            <button onclick="closeModal()" style="width:100%;padding:14px;background:#334155;border:none;border-radius:12px;">Close</button>
        </div>
    </div>

    <script>
        // Real logos & game images
        const apps = [
            {name: "YouTube", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/YouTube_full-color_icon_%282017%29.svg/512px-YouTube_full-color_icon_%282017%29.svg.png", url: "https://youtube.com"},
            {name: "Reddit", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/Reddit_logo_new.svg/512px-Reddit_logo_new.svg.png", url: "https://reddit.com"},
            {name: "Google", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_2015_logo.svg/512px-Google_2015_logo.svg.png", url: "https://google.com"},
            {name: "TikTok", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/TikTok_logo.svg/512px-TikTok_logo.svg.png", url: "https://tiktok.com"},
            {name: "Instagram", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/512px-Instagram_icon.png", url: "https://instagram.com"},
            {name: "Spotify", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/Spotify_icon.svg/512px-Spotify_icon.svg.png", url: "https://open.spotify.com"},
            {name: "Discord", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/Discord_logo.svg/512px-Discord_logo.svg.png", url: "https://discord.com"},
            {name: "Slope", img: "https://picsum.photos/id/1015/300/300", url: "https://slope-game.io"},
            {name: "Retro Bowl", img: "https://picsum.photos/id/201/300/300", url: "https://retrobowl.me"},
            {name: "Cookie Clicker", img: "https://picsum.photos/id/180/300/300", url: "https://cookieclicker.io"},
            {name: "Five Nights at Epstein's", img: "https://picsum.photos/id/237/300/300", url: "https://fivenightsatepsteins.org/FNAE-HTML5-1.2.3/index.html"},
        ];

        let currentTabs = [];
        let activeTabId = null;

        function populateApps() {
            const grid = document.getElementById('apps-grid');
            grid.innerHTML = '';
            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <div class="app-icon"><img src="${app.img}" alt="${app.name}"></div>
                    <div class="app-name">${app.name}</div>
                `;
                card.onclick = () => openInBrowser(app.url, app.name);
                grid.appendChild(card);
            });
        }

        function openInBrowser(url, title = "Vault Browser") {
            const id = 'tab-' + Date.now();
            currentTabs.push({id, url, title});
            renderTabs();
            activateTab(id);
        }

        function renderTabs() {
            const bar = document.getElementById('tab-bar');
            bar.innerHTML = '';
            currentTabs.forEach(tab => {
                const t = document.createElement('div');
                t.className = `tab ${tab.id === activeTabId ? 'active' : ''}`;
                t.innerHTML = `${tab.title} <span onclick="closeTab('${tab.id}');event.stopImmediatePropagation()" style="margin-left:12px;color:#f87171;">×</span>`;
                t.onclick = () => activateTab(tab.id);
                bar.appendChild(t);
            });
        }

        function activateTab(id) {
            activeTabId = id;
            const tab = currentTabs.find(t => t.id === id);
            document.getElementById('browser-container').style.display = 'flex';
            document.getElementById('main-browser').src = tab.url;
            renderTabs();
        }

        function closeTab(id) {
            currentTabs = currentTabs.filter(t => t.id !== id);
            if (currentTabs.length > 0) activateTab(currentTabs[0].id);
            else document.getElementById('browser-container').style.display = 'none';
            renderTabs();
        }

        function newBrowserTab() {
            openInBrowser("https://google.com", "New Tab");
        }

        function handleSearch() {
            const q = document.getElementById('global-search').value.trim();
            if (!q) return;
            const url = q.startsWith('http') ? q : `https://duckduckgo.com/?q=${encodeURIComponent(q)}`;
            openInBrowser(url, q.substring(0, 20));
        }

        function toggleUnblockModal() {
            const modal = document.getElementById('unblock-modal');
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <button onclick="openInBrowser('https://tiktok.com','TikTok')" style="width:100%;padding:16px;background:#334155;border:none;border-radius:12px;text-align:left;">TikTok</button>
                <button onclick="openInBrowser('https://dulo.tv','Cinema')" style="width:100%;padding:16px;background:#334155;border:none;border-radius:12px;text-align:left;">Dulo.tv</button>
            `;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('unblock-modal').style.display = 'none';
        }

        function navigateTo(page) {
            if (page === 'games') openInBrowser('https://retrobowl.me', 'Games');
            else if (page === 'cinema') openInBrowser('https://dulo.tv', 'Cinema');
            else if (page === 'music') openInBrowser('https://open.spotify.com', 'Music');
        }

        function filterCategory(el) {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
        }

        function updateClock() {
            setInterval(() => {
                document.getElementById('clock').textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            }, 1000);
        }

        function initVault() {
            populateApps();
            updateClock();
            openInBrowser("https://google.com", "Google");
            console.log("%cVault OS - Polaris Style Loaded", "color:#fbbf24; font-size:14px;");
        }

        window.onload = initVault;

        // Expose
        window.openInBrowser = openInBrowser;
        window.toggleUnblockModal = toggleUnblockModal;
        window.closeModal = closeModal;
        window.handleSearch = handleSearch;
        window.newBrowserTab = newBrowserTab;
        window.navigateTo = navigateTo;
    </script>
</body>
</html>
