<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault OS • Polaris Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --accent: #f59e0b;
            --text-primary: #f4f4f5;
            --text-secondary: #d1d5db;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #000;
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Gargantua Black Hole Wallpaper */
        #wallpaper {
            position: fixed;
            inset: 0;
            z-index: -3;
            overflow: hidden;
        }
        #wallpaper iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: brightness(0.75) contrast(1.1);
        }

        #sidebar {
            width: 260px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-right: 1px solid #334155;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            z-index: 100;
            height: 100vh;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 50px;
            padding: 0 12px;
        }

        .nav-item {
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(245, 158, 11, 0.15);
            color: white;
        }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #top-bar {
            height: 68px;
            display: flex;
            align-items: center;
            padding: 0 32px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            z-index: 50;
        }

        #search-container {
            flex: 1;
            max-width: 720px;
            margin: 0 auto;
        }

        #global-search {
            width: 100%;
            padding: 18px 28px;
            font-size: 18px;
            background: rgba(30, 41, 59, 0.85);
            border: 2px solid #475569;
            border-radius: 9999px;
            color: white;
            backdrop-filter: blur(8px);
        }
        #global-search:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.3);
        }

        #content-area {
            flex: 1;
            padding: 40px 40px 0;
            overflow-y: auto;
        }

        .category-pills {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        .pill {
            padding: 8px 22px;
            background: rgba(51, 65, 85, 0.7);
            border-radius: 9999px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .pill:hover, .pill.active {
            background: var(--accent);
            color: black;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 24px;
        }
        .app-card {
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .app-card:hover { transform: scale(1.08); }
        .app-icon {
            width: 78px;
            height: 78px;
            background: #1e2937;
            border-radius: 18px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4);
        }
        .app-name {
            font-size: 13.5px;
            font-weight: 500;
        }

        #browser-container {
            display: none;
            flex-direction: column;
            height: 100%;
            background: #000;
        }
        #main-browser {
            flex: 1;
            border: none;
        }

        .tab-bar {
            background: #1e2937;
            display: flex;
            align-items: center;
            padding: 0 12px;
            height: 52px;
            overflow-x: auto;
        }
        .tab {
            padding: 0 20px;
            height: 100%;
            display: flex;
            align-items: center;
            background: #334155;
            margin-right: 6px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            white-space: nowrap;
        }
        .tab.active {
            background: #0f172a;
        }
    </style>
</head>
<body>
    <!-- Black Hole Wallpaper -->
    <div id="wallpaper">
        <iframe src="https://www.youtube.com/embed/gU4vSEZwiyE?autoplay=1&amp;mute=1&amp;loop=1&amp;playlist=gU4vSEZwiyE&amp;controls=0&amp;showinfo=0&amp;rel=0&amp;iv_load_policy=3" allow="autoplay" title="Gargantua"></iframe>
    </div>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="logo">
            <span style="font-size:34px;">🔒</span>
            <span>Vault</span>
        </div>

        <div class="nav-item active" onclick="navigateTo('home')"><span style="font-size:22px;">🏠</span> Home</div>
        <div class="nav-item" onclick="navigateTo('games')"><span style="font-size:22px;">🎮</span> Games</div>
        <div class="nav-item" onclick="navigateTo('movies')"><span style="font-size:22px;">🎥</span> Cinema</div>
        <div class="nav-item" onclick="navigateTo('music')"><span style="font-size:22px;">🎵</span> Music</div>
        
        <div style="margin-top: auto; padding: 0 12px;">
            <button onclick="toggleUnblockModal()" 
                    style="width:100%; padding:16px; background:#f59e0b; color:black; border:none; border-radius:12px; font-weight:600;">
                Unblock Sites
            </button>
        </div>
    </div>

    <div id="main">
        <!-- Top Bar with Search -->
        <div id="top-bar">
            <div id="search-container">
                <input id="global-search" type="text" placeholder="Search the web or enter a URL" 
                       onkeypress="if(event.key==='Enter') handleSearch()">
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar" id="tab-bar"></div>

        <!-- Content -->
        <div id="content-area">
            <!-- Home View -->
            <div id="home-view">
                <div class="category-pills">
                    <div class="pill active">Popular</div>
                    <div class="pill" onclick="navigateTo('games')">Games</div>
                    <div class="pill" onclick="navigateTo('movies')">Cinema</div>
                </div>

                <div class="apps-grid" id="home-apps"></div>

                <h3 style="margin: 50px 0 20px; color:#cbd5e1;">Quick Unblock</h3>
                <div style="display:flex; gap:16px; flex-wrap:wrap;" id="quick-links"></div>
            </div>

            <!-- Games Arcade -->
            <div id="games-view" style="display:none;">
                <h2 style="margin-bottom:30px;">Arcade</h2>
                <div class="apps-grid" id="arcade-grid"></div>
            </div>

            <!-- Movies -->
            <div id="movies-view" style="display:none;">
                <h2>Cinema</h2>
                <p style="color:#94a3b8;">Streaming from trusted unblocked sources</p>
                <button onclick="openInBrowser('https://dulo.tv')" 
                        style="margin-top:20px; padding:16px 32px; background:#f59e0b; color:black; border:none; border-radius:9999px; font-size:17px;">
                    Open Dulo.tv Cinema
                </button>
            </div>

            <!-- Music -->
            <div id="music-view" style="display:none;">
                <h2>Music</h2>
                <button onclick="openInBrowser('https://open.spotify.com')" style="padding:16px 32px; background:#1db954; color:white; border:none; border-radius:9999px;">Open Spotify</button>
            </div>
        </div>

        <!-- Browser View -->
        <div id="browser-container">
            <iframe id="main-browser" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Unblock Modal -->
    <div id="unblock-modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:9999;">
        <div style="background:#1e2937;padding:40px;border-radius:20px;width:460px;">
            <h3 style="margin-bottom:24px;">Unblock Links</h3>
            <div id="modal-links" style="display:flex;flex-direction:column;gap:12px;"></div>
            <button onclick="closeModal()" style="margin-top:30px;width:100%;padding:14px;background:#334155;border:none;border-radius:12px;">Close</button>
        </div>
    </div>

    <script>
        let currentTabs = [];
        let activeTabId = null;

        function generateId() { return 'tab-' + Date.now(); }

        function renderTabs() {
            const bar = document.getElementById('tab-bar');
            bar.innerHTML = '';
            currentTabs.forEach(tab => {
                const t = document.createElement('div');
                t.className = `tab ${tab.id === activeTabId ? 'active' : ''}`;
                t.innerHTML = `${tab.title} <span onclick="closeTab('${tab.id}');event.stopImmediatePropagation()" style="margin-left:12px;color:#f87171;">×</span>`;
                t.onclick = () => activateTab(tab.id);
                bar.appendChild(t);
            });
        }

        function addTab(url, title) {
            const id = generateId();
            currentTabs.push({id, url, title: title.length > 20 ? title.substring(0,18)+'...' : title});
            renderTabs();
            activateTab(id);
        }

        function activateTab(id) {
            activeTabId = id;
            const tab = currentTabs.find(t => t.id === id);
            if (!tab) return;
            document.getElementById('content-area').style.display = 'none';
            document.getElementById('browser-container').style.display = 'flex';
            document.getElementById('main-browser').src = tab.url;
            renderTabs();
        }

        function closeTab(id) {
            const idx = currentTabs.findIndex(t => t.id === id);
            if (idx === -1) return;
            currentTabs.splice(idx, 1);
            if (activeTabId === id && currentTabs.length > 0) activateTab(currentTabs[0].id);
            else if (currentTabs.length === 0) showHome();
            renderTabs();
        }

        function showHome() {
            document.getElementById('browser-container').style.display = 'none';
            document.getElementById('content-area').style.display = 'block';
            document.querySelectorAll('#content-area > div').forEach(d => d.style.display = 'none');
            document.getElementById('home-view').style.display = 'block';
        }

        function navigateTo(section) {
            showHome();
            document.querySelectorAll('#content-area > div').forEach(d => d.style.display = 'none');
            if (section === 'games') document.getElementById('games-view').style.display = 'block';
            else if (section === 'movies') document.getElementById('movies-view').style.display = 'block';
            else if (section === 'music') document.getElementById('music-view').style.display = 'block';
        }

        function handleSearch() {
            const q = document.getElementById('global-search').value.trim();
            if (!q) return;
            let url = q.startsWith('http') ? q : 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
            addTab(url, q);
        }

        function openInBrowser(url, title = "Vault Browser") {
            addTab(url, title);
        }

        function toggleUnblockModal() {
            const modal = document.getElementById('unblock-modal');
            const container = document.getElementById('modal-links');
            container.innerHTML = `
                <button onclick="openInBrowser('https://www.tiktok.com','TikTok')" style="padding:16px;background:#334155;border:none;border-radius:12px;width:100%;text-align:left;">TikTok</button>
                <button onclick="openInBrowser('https://vt.tiktok.com','TikTok')" style="padding:16px;background:#334155;border:none;border-radius:12px;width:100%;text-align:left;">TikTok VT</button>
                <button onclick="openInBrowser('https://dulo.tv','Cinema')" style="padding:16px;background:#334155;border:none;border-radius:12px;width:100%;text-align:left;">Dulo.tv</button>
            `;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('unblock-modal').style.display = 'none';
        }

        // Games Arcade
        const arcadeGames = [
            {name: "Slope", url: "https://slope-game.io", emoji: "🏂"},
            {name: "Retro Bowl", url: "https://retrobowl.me", emoji: "🏈"},
            {name: "Cookie Clicker", url: "https://cookieclicker.io", emoji: "🍪"},
            {name: "Geometry Dash", url: "https://geometrydash.io", emoji: "📐"},
            {name: "Vex 7", url: "https://vex7.io", emoji: "⚔️"},
            {name: "Five Nights at Epstein's", url: "https://fivenightsatepsteins.org/FNAE-HTML5-1.2.3/index.html", emoji: "🕹️"},
            {name: "Happy Wheels", url: "https://playhop.io/happywheels", emoji: "🚲"},
            {name: "Run 3", url: "https://playhop.io/run3", emoji: "🏃"},
            {name: "Tank Trouble", url: "https://froggiesarcade.com/tanktrouble", emoji: "🛡️"},
        ];

        function populateHomeApps() {
            const container = document.getElementById('home-apps');
            const popular = arcadeGames.slice(0, 8);
            popular.forEach(game => {
                const div = document.createElement('div');
                div.className = 'app-card';
                div.innerHTML = `
                    <div class="app-icon">${game.emoji}</div>
                    <div class="app-name">${game.name}</div>
                `;
                div.onclick = () => openInBrowser(game.url, game.name);
                container.appendChild(div);
            });
        }

        function populateArcade() {
            const container = document.getElementById('arcade-grid');
            arcadeGames.forEach(game => {
                const div = document.createElement('div');
                div.className = 'app-card';
                div.innerHTML = `
                    <div class="app-icon">${game.emoji}</div>
                    <div class="app-name">${game.name}</div>
                `;
                div.onclick = () => openInBrowser(game.url, game.name);
                container.appendChild(div);
            });
        }

        function populateQuickLinks() {
            const container = document.getElementById('quick-links');
            const links = [
                {name: "TikTok", url: "https://www.tiktok.com"},
                {name: "TikTok VT", url: "https://vt.tiktok.com"},
                {name: "Dulo.tv", url: "https://dulo.tv"},
            ];
            links.forEach(l => {
                const btn = document.createElement('button');
                btn.style.cssText = "padding:14px 28px; background:rgba(51,65,85,0.8); border:none; border-radius:9999px; color:white;";
                btn.textContent = l.name;
                btn.onclick = () => openInBrowser(l.url);
                container.appendChild(btn);
            });
        }

        function initialize() {
            populateHomeApps();
            populateArcade();
            populateQuickLinks();
            addTab("https://google.com", "Google");
            console.log("%cVault OS Polaris Edition - Black Hole ready", "color:#fbbf24;font-size:14px");
        }

        window.onload = initialize;

        // Expose functions
        window.navigateTo = navigateTo;
        window.openInBrowser = openInBrowser;
        window.handleSearch = handleSearch;
        window.toggleUnblockModal = toggleUnblockModal;
        window.closeModal = closeModal;
        window.showHome = showHome;
    </script>
</body>
</html>
