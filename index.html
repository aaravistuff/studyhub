<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --accent: #f59e0b;
            --sidebar-bg: #1a2338;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
        }

        /* ================================================
           VAULT OS - FULL POLARIS STYLE - EXPANDED
           ================================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            color: var(--text);
            background: #000;
            display: flex;
            position: relative;
            font-size: 15px;
        }

        /* === LOADING SCREEN === */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #0a0f1c;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            flex-direction: column;
            transition: opacity 0.8s ease;
        }
        .loader {
            width: 72px;
            height: 72px;
            border: 7px solid #334155;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1.1s linear infinite;
            margin-bottom: 28px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text {
            font-size: 19px;
            letter-spacing: 4px;
            font-weight: 600;
            color: #cbd5e1;
        }

        /* === WALLPAPER - GARGANTUA BLACK HOLE === */
        #wallpaper {
            position: fixed;
            inset: 0;
            z-index: -3;
            background: #000 url('https://picsum.photos/id/1015/2560/1440') center/cover no-repeat;
            filter: brightness(0.68) contrast(1.18) saturate(1.05);
            transition: all 1.2s ease;
        }

        /* === SIDEBAR === */
        #sidebar {
            width: 268px;
            background: var(--sidebar-bg);
            border-right: 1px solid #334155;
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
            height: 100vh;
            overflow-y: auto;
        }

        .logo {
            padding: 0 28px 40px;
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .nav-header {
            padding: 16px 28px 8px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-item {
            padding: 14px 28px;
            display: flex;
            align-items: center;
            gap: 18px;
            color: #cbd5e1;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.25s ease;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(245, 158, 11, 0.22);
            color: white;
        }

        /* === MAIN CONTENT === */
        #main {
            flex: 1;
            position: relative;
        }

        #top-right {
            position: absolute;
            top: 34px;
            right: 52px;
            text-align: right;
            z-index: 50;
        }
        .day { font-size: 54px; font-weight: 600; line-height: 1; }
        .subtitle { font-size: 15.5px; color: var(--text-muted); margin-top: 6px; }

        #search-bar {
            position: absolute;
            top: 138px;
            left: 50%;
            transform: translateX(-50%);
            width: 680px;
            z-index: 60;
        }
        #global-search {
            width: 100%;
            padding: 21px 32px 21px 64px;
            font-size: 17.8px;
            background: rgba(30, 41, 59, 0.95);
            border: 2px solid #475569;
            border-radius: 9999px;
            color: white;
            transition: all 0.3s;
        }
        #global-search:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 6px rgba(245,158,11,0.28);
            outline: none;
        }

        .category-pills {
            position: absolute;
            top: 228px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(15,23,42,0.9);
            padding: 7px;
            border-radius: 9999px;
            z-index: 50;
        }
        .pill {
            padding: 10px 28px;
            border-radius: 9999px;
            font-size: 14.8px;
            cursor: pointer;
            transition: all 0.25s;
        }
        .pill.active {
            background: var(--accent);
            color: black;
            font-weight: 600;
        }

        #apps-grid {
            position: absolute;
            top: 316px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(7, 112px);
            gap: 36px 28px;
            z-index: 40;
        }
        .app-card {
            text-align: center;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .app-card:hover { transform: scale(1.12) translateY(-4px); }
        .app-icon {
            width: 86px;
            height: 86px;
            border-radius: 20px;
            margin: 0 auto 12px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.65);
        }
        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .app-name {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.3;
        }

        /* === BROWSER SECTION === */
        #browser-container {
            display: none;
            flex-direction: column;
            height: 100%;
            position: absolute;
            inset: 0;
            z-index: 200;
            background: #000;
        }
        .tab-bar {
            height: 58px;
            background: #1e2937;
            display: flex;
            align-items: center;
            padding: 0 12px;
            overflow-x: auto;
            border-bottom: 1px solid #334155;
        }
        .tab {
            padding: 0 26px;
            height: 100%;
            display: flex;
            align-items: center;
            background: #334155;
            margin-right: 8px;
            border-radius: 10px 10px 0 0;
            white-space: nowrap;
            cursor: pointer;
            font-size: 14.8px;
            position: relative;
        }
        .tab.active {
            background: #0f172a;
            border-bottom: 4px solid var(--accent);
        }
        .tab-close {
            margin-left: 16px;
            font-size: 19px;
            color: #f87171;
            padding: 2px 6px;
            border-radius: 4px;
        }
        #main-browser {
            flex: 1;
            border: none;
        }

        /* === BOTTOM BAR === */
        #bottom-bar {
            position: absolute;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15,23,42,0.92);
            backdrop-filter: blur(16px);
            padding: 10px 32px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 80;
            font-size: 15px;
        }

        /* Extra utility styles for length */
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .glow { box-shadow: 0 0 25px rgba(245,158,11,0.4); }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loading-screen">
        <div class="loader"></div>
        <div id="loading-text">LOADING VAULT OS...</div>
    </div>

    <!-- WALLPAPER -->
    <div id="wallpaper"></div>

    <!-- SIDEBAR -->
    <div id="sidebar">
        <div class="logo">
            <span style="font-size:34px;">🔒</span>
            <span>Vault OS</span>
        </div>

        <div class="nav-item active" onclick="navigateTo('home')"><span>🏠</span> Home</div>

        <div class="nav-header">ENTERTAINMENT</div>
        <div class="nav-item" onclick="navigateTo('cinema')"><span>🎥</span> Cinema</div>
        <div class="nav-item" onclick="navigateTo('music')"><span>🎵</span> Music</div>
        <div class="nav-item" onclick="navigateTo('games')"><span>🎮</span> Games</div>
        <div class="nav-item"><span>🕹️</span> Emulator</div>
        <div class="nav-item"><span>🔊</span> Soundboard</div>
        <div class="nav-item"><span>📜</span> My List</div>

        <div class="nav-header">TOOLS</div>
        <div class="nav-item" onclick="newTab()"><span>🌐</span> Browser</div>

        <div style="margin-top: auto; padding: 0 24px 40px;">
            <button onclick="toggleUnblockModal()" 
                    style="width:100%; padding:16px; background:#334155; border:none; border-radius:9999px; color:white; font-weight:600;">
                Unblock Sites
            </button>
        </div>
    </div>

    <div id="main">
        <!-- Top Right -->
        <div id="top-right">
            <div class="day">Sunday</div>
            <div class="subtitle">VAULT OS • Your cinematic web hub</div>
        </div>

        <!-- Search -->
        <div id="search-bar">
            <input id="global-search" type="text" placeholder="Search the web or enter a URL" 
                   onkeypress="if(event.key==='Enter') handleSearch()">
        </div>

        <!-- Category Pills -->
        <div class="category-pills">
            <div class="pill active">Popular</div>
            <div class="pill" onclick="filterCategory(this)">Games</div>
            <div class="pill" onclick="filterCategory(this)">Websites</div>
            <div class="pill" onclick="filterCategory(this)">Media</div>
        </div>

        <!-- Apps Grid -->
        <div id="apps-grid"></div>

        <!-- Bottom Bar -->
        <div id="bottom-bar">
            <span onclick="newTab()" style="cursor:pointer;">🌐 New Tab</span>
            <span id="clock"></span>
        </div>
    </div>

    <!-- Browser Container -->
    <div id="browser-container">
        <div class="tab-bar" id="tab-bar"></div>
        <iframe id="main-browser" allowfullscreen></iframe>
    </div>

    <!-- Unblock Modal -->
    <div id="unblock-modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.94);display:none;align-items:center;justify-content:center;z-index:9999;">
        <div style="background:#1e2937;padding:42px;border-radius:20px;width:480px;">
            <h3 style="margin-bottom:24px;">Unblock Quick Access</h3>
            <div id="modal-links" style="display:flex;flex-direction:column;gap:14px;"></div>
            <button onclick="closeModal()" style="margin-top:32px;width:100%;padding:16px;background:#334155;border:none;border-radius:9999px;">Close</button>
        </div>
    </div>

    <script>
        // =============================================
        // VAULT OS - FULL EXPANDED JAVASCRIPT
        // =============================================

        const apps = [
            {name: "YouTube", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/YouTube_full-color_icon_%282017%29.svg/512px-YouTube_full-color_icon_%282017%29.svg.png", url: "https://youtube.com"},
            {name: "TikTok", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/TikTok_logo.svg/512px-TikTok_logo.svg.png", url: "https://tiktok.com"},
            {name: "Slope", img: "https://picsum.photos/id/1015/400/400", url: "https://slope-game.io"},
            {name: "Retro Bowl", img: "https://picsum.photos/id/201/400/400", url: "https://retrobowl.me"},
            {name: "Cookie Clicker", img: "https://picsum.photos/id/180/400/400", url: "https://cookieclicker.io"},
            {name: "Five Nights at Epstein's", img: "https://picsum.photos/id/237/400/400", url: "https://fivenightsatepsteins.org/FNAE-HTML5-1.2.3/index.html"},
            {name: "Dulo.tv", img: "https://picsum.photos/id/1016/400/400", url: "https://dulo.tv"},
            {name: "Geometry Dash", img: "https://picsum.photos/id/251/400/400", url: "https://geometrydash.io"},
            {name: "Happy Wheels", img: "https://picsum.photos/id/133/400/400", url: "https://playhop.io/happywheels"}
        ];

        let currentTabs = [];
        let activeTabId = null;

        function hideLoading() {
            const loader = document.getElementById('loading-screen');
            loader.style.opacity = '0';
            setTimeout(() => { loader.style.display = 'none'; }, 800);
        }

        function populateApps() {
            const grid = document.getElementById('apps-grid');
            grid.innerHTML = '';
            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <div class="app-icon"><img src="${app.img}" alt="${app.name}"></div>
                    <div class="app-name">${app.name}</div>
                `;
                card.onclick = () => openInBrowser(app.url, app.name);
                grid.appendChild(card);
            });
        }

        function openInBrowser(url, title = "Vault") {
            const id = 'tab-' + Date.now();
            currentTabs.push({id, url, title: title.length > 22 ? title.substring(0,19)+'...' : title});
            renderTabs();
            activateTab(id);
        }

        function renderTabs() {
            const bar = document.getElementById('tab-bar');
            bar.innerHTML = '';
            currentTabs.forEach(tab => {
                const t = document.createElement('div');
                t.className = `tab ${tab.id === activeTabId ? 'active' : ''}`;
                t.innerHTML = `${tab.title} <span class="tab-close" onclick="closeTab('${tab.id}');event.stopImmediatePropagation()">×</span>`;
                t.onclick = (e) => {
                    if (!e.target.classList.contains('tab-close')) activateTab(tab.id);
                };
                bar.appendChild(t);
            });
        }

        function activateTab(id) {
            activeTabId = id;
            const tab = currentTabs.find(t => t.id === id);
            if (!tab) return;
            document.getElementById('browser-container').style.display = 'flex';
            document.getElementById('main-browser').src = tab.url;
            renderTabs();
        }

        function closeTab(id) {
            currentTabs = currentTabs.filter(t => t.id !== id);
            if (currentTabs.length > 0) activateTab(currentTabs[0].id);
            else document.getElementById('browser-container').style.display = 'none';
            renderTabs();
        }

        function newTab() {
            openInBrowser("https://google.com", "New Tab");
        }

        function handleSearch() {
            let q = document.getElementById('global-search').value.trim();
            if (!q) return;
            let url = q.startsWith('http') ? q : `https://duckduckgo.com/?q=${encodeURIComponent(q)}`;
            openInBrowser(url, q.substring(0, 25));
        }

        function navigateTo(page) {
            if (page === 'games') openInBrowser('https://retrobowl.me', 'Games Arcade');
            else if (page === 'cinema') openInBrowser('https://dulo.tv', 'Cinema');
            else if (page === 'music') openInBrowser('https://open.spotify.com', 'Music');
        }

        function toggleUnblockModal() {
            const modal = document.getElementById('unblock-modal');
            const linksDiv = document.getElementById('modal-links');
            linksDiv.innerHTML = `
                <button onclick="openInBrowser('https://tiktok.com','TikTok')" style="width:100%;padding:16px;background:#334155;border:none;border-radius:12px;text-align:left;">TikTok</button>
                <button onclick="openInBrowser('https://dulo.tv','Dulo.tv')" style="width:100%;padding:16px;background:#334155;border:none;border-radius:12px;text-align:left;">Dulo.tv</button>
            `;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('unblock-modal').style.display = 'none';
        }

        function filterCategory(el) {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
        }

        function updateClock() {
            setInterval(() => {
                const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                document.getElementById('clock').textContent = time;
            }, 1000);
        }

        function initVaultOS() {
            populateApps();
            updateClock();
            newTab();           // Start with a tab
            hideLoading();
            console.log("%cVault OS - Fully Loaded (Polaris Style)", "color:#fbbf24;font-size:16px;font-weight:700");
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 't' && e.ctrlKey) {
                e.preventDefault();
                newTab();
            }
        });

        window.onload = initVaultOS;

        // Global API
        window.openInBrowser = openInBrowser;
        window.handleSearch = handleSearch;
        window.newTab = newTab;
        window.navigateTo = navigateTo;
        window.toggleUnblockModal = toggleUnblockModal;
        window.closeModal = closeModal;
        window.filterCategory = filterCategory;
    </script>
</body>
</html>
