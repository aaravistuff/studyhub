<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --accent: #f59e0b;
            --sidebar: #1e2937;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            color: #e2e8f0;
            background: #000;
            display: flex;
        }

        #loading {
            position: fixed; inset: 0; background: #0a0f1c; z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner {
            width: 64px; height: 64px; border: 6px solid #334155;
            border-top: 6px solid var(--accent); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #wallpaper {
            position: fixed; inset: 0; z-index: -2;
        }
        #wallpaper iframe {
            width: 100%; height: 100%; border: none;
        }

        #sidebar {
            width: 272px; background: var(--sidebar); border-right: 1px solid #334155;
            padding: 28px 0; display: flex; flex-direction: column; z-index: 100;
        }
        .logo-area {
            padding: 0 28px 48px; display: flex; align-items: center; gap: 12px;
        }
        .vault-logo {
            font-size: 27px; font-weight: 700; letter-spacing: -1.2px;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .nav-item {
            padding: 14px 28px; display: flex; align-items: center; gap: 16px;
            color: #cbd5e1; cursor: pointer; font-weight: 500;
        }
        .nav-item:hover, .nav-item.active { background: rgba(245,158,11,0.18); }

        #main { flex: 1; position: relative; }
        #search-container {
            position: absolute; top: 130px; left: 50%; transform: translateX(-50%); width: 660px;
        }
        #global-search {
            width: 100%; padding: 20px 28px; font-size: 17px;
            background: rgba(30,41,59,0.95); border: 2px solid #475569; border-radius: 9999px;
        }

        .quick-links {
            position: absolute; top: 210px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 28px; z-index: 50;
        }
        .quick-link {
            text-align: center; cursor: pointer; transition: transform 0.3s;
        }
        .quick-link:hover { transform: scale(1.12); }
        .quick-link img {
            width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        #browser-container {
            display: none; flex-direction: column; position: absolute; inset: 0; z-index: 200; background: #000;
        }
        .tab-bar {
            height: 58px; background: #1e2937; display: flex; align-items: center;
            padding: 0 12px; overflow-x: auto;
        }
        .tab {
            padding: 0 24px; height: 100%; display: flex; align-items: center;
            background: #334155; margin-right: 6px; border-radius: 8px 8px 0 0;
            cursor: pointer; white-space: nowrap;
        }
        .tab.active { background: #0f172a; border-bottom: 4px solid var(--accent); }
        .tab .close { margin-left: 12px; color: #f87171; font-size: 20px; cursor: pointer; }
        #main-browser { flex: 1; border: none; }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <p style="margin-top:24px;font-size:18px;letter-spacing:2px;">Initializing Vault OS...</p>
    </div>

    <div id="wallpaper">
        <iframe src="https://www.youtube.com/embed/gU4vSEZwiyE?autoplay=1&mute=1&loop=1&playlist=gU4vSEZwiyE&controls=0&showinfo=0&rel=0" allow="autoplay" style="width:100%;height:100%;border:none;"></iframe>
    </div>

    <div id="sidebar">
        <div class="logo-area">
            <div class="vault-logo">VAULT</div>
            <span style="font-size:26px;font-weight:700;">OS</span>
        </div>

        <div class="nav-item active" onclick="showHome()">Home</div>
        <div class="nav-header">ENTERTAINMENT</div>
        <div class="nav-item" onclick="openInBrowser('https://dulo.tv', 'Cinema')">Cinema</div>
        <div class="nav-item" onclick="openInBrowser('https://open.spotify.com', 'Music')">Music</div>
        <div class="nav-item" onclick="openVaultArcade()">Vault Arcade</div>

        <div class="nav-header">TOOLS</div>
        <div class="nav-item" onclick="newTab()">OSBrowser</div>
    </div>

    <div id="main">
        <div id="search-container">
            <input id="global-search" type="text" placeholder="Search the web or enter a URL" onkeypress="if(event.key==='Enter') performSearch()">
        </div>

        <div class="quick-links">
            <div class="quick-link" onclick="openInBrowser('https://tiktok.com', 'TikTok')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/TikTok_logo.svg/512px-TikTok_logo.svg.png" alt="TikTok">
                <span>TikTok</span>
            </div>
            <div class="quick-link" onclick="openInBrowser('https://youtube.com', 'YouTube')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/YouTube_full-color_icon_%282017%29.svg/512px-YouTube_full-color_icon_%282017%29.svg.png" alt="YouTube">
                <span>YouTube</span>
            </div>
        </div>
    </div>

    <!-- OSBrowser -->
    <div id="browser-container">
        <div class="tab-bar" id="tab-bar"></div>
        <iframe id="main-browser" allowfullscreen></iframe>
    </div>

    <script>
        let currentTabs = [];
        let activeTabId = null;
        const proxyBase = "https://velara.buzz/";

        function proxyUrl(url) {
            return proxyBase + "?url=" + encodeURIComponent(url);
        }

        function hideLoading() {
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => document.getElementById('loading').style.display = 'none', 600);
        }

        function openInBrowser(url, title = "OSBrowser") {
            const proxied = proxyUrl(url);
            const id = 'tab-' + Date.now();
            currentTabs.push({id, url: proxied, title});
            renderTabs();
            activateTab(id);
        }

        function renderTabs() {
            const bar = document.getElementById('tab-bar');
            bar.innerHTML = '<div onclick="newTab()" style="padding:0 20px;cursor:pointer;font-size:28px;color:#94a3b8;">+</div>';
            currentTabs.forEach(tab => {
                const t = document.createElement('div');
                t.className = `tab ${tab.id === activeTabId ? 'active' : ''}`;
                t.innerHTML = `${tab.title} <span class="close" onclick="closeTab('${tab.id}');event.stopImmediatePropagation()">×</span>`;
                t.onclick = (e) => { if (!e.target.classList.contains('close')) activateTab(tab.id); };
                bar.appendChild(t);
            });
        }

        function activateTab(id) {
            activeTabId = id;
            const tab = currentTabs.find(t => t.id === id);
            if (!tab) return;
            document.getElementById('browser-container').style.display = 'flex';
            document.getElementById('main-browser').src = tab.url;
            renderTabs();
        }

        function closeTab(id) {
            currentTabs = currentTabs.filter(t => t.id !== id);
            if (currentTabs.length > 0) activateTab(currentTabs[0].id);
            else document.getElementById('browser-container').style.display = 'none';
            renderTabs();
        }

        function newTab() {
            openInBrowser("https://google.com", "New Tab");
        }

        function performSearch() {
            let q = document.getElementById('global-search').value.trim();
            if (!q) return;
            let url = q.startsWith('http') ? q : `https://duckduckgo.com/?q=${encodeURIComponent(q)}`;
            openInBrowser(url, q.substring(0,20) || "Search");
        }

        function showHome() {
            document.getElementById('browser-container').style.display = 'none';
        }

        // Vault Arcade with ALL games including Five Nights at Epstein's
        const vaultArcadeGames = [
            {name: "Five Nights at Epstein's", url: "https://fivenightsatepsteins.org/FNAE-HTML5-1.2.3/index.html"},
            {name: "Alien Hominid", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/393.html"},
            {name: "Customer Support", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/383.html"},
            {name: "The Deadseat", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/395.html"},
            {name: "Fireboy & Watergirl", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/385.html"},
            {name: "Deltatraveler", url: "https://script.google.com/macros/s/AKfycbx137PRDh0Of0SDaXqu2fKaJ8Ht8Os5Nabi3xeIWYs_dCA0jP4SKRjQ9P9nC1xeruWK/exec?game=388"},
            {name: "Needy Streamer Overload", url: "https://script.google.com/macros/s/AKfycbx137PRDh0Of0SDaXqu2fKaJ8Ht8Os5Nabi3xeIWYs_dCA0jP4SKRjQ9P9nC1xeruWK/exec?game=389"},
            {name: "Pizza Tower", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/394.html"},
            {name: "TileTopia", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/391.html"},
            {name: "Earn to Die", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/378.html"},
            {name: "Earn to Die 2", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/379.html"},
            {name: "Bart Blast", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/380.html"},
            {name: "Bendy and the Ink Machine", url: "https://script.google.com/macros/s/AKfycby_6uwHt90FuvgGfTLTHhveJVw0nEJ_bMxq8GTaA1KjFfpmu0g08RlArFt61GAw7WOw/exec?game=374"},
            {name: "Gacha Life", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/375.html"},
            {name: "Gacha Verse", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/376.html"},
            {name: "Tung Sahur Horror", url: "https://script.google.com/macros/s/AKfycby_6uwHt90FuvgGfTLTHhveJVw0nEJ_bMxq8GTaA1KjFfpmu0g08RlArFt61GAw7WOw/exec?game=377"},
            {name: "Horror Tale", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/373.html"},
            {name: "Dumb Ways to Die", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/372.html"},
            {name: "Bloons Tower Defense 1", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/367.html"},
            {name: "Bloons Tower Defense 2", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/368.html"},
            {name: "Bloons Tower Defense 3", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/369.html"},
            {name: "Bloons Tower Defense 4", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/370.html"},
            {name: "Bloons Tower Defense 5", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/371.html"},
            {name: "Brotato", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/366.html"},
            {name: "Endoparasitic 2", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/365.html"},
            {name: "Endoparasitic", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/364.html"},
            {name: "Baby Sniper In Vietnam", url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/games/363.html"}
        ];

        function openVaultArcade() {
            let html = `
                <h2 style="color:white;text-align:center;margin:40px 0 30px;font-size:32px;">Vault Arcade</h2>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;padding:0 40px;">
            `;

            vaultArcadeGames.forEach(g => {
                html += `
                    <div onclick="openInBrowser('${g.url}', '${g.name}')" 
                         style="background:#1e2937;padding:24px;border-radius:16px;cursor:pointer;text-align:center;transition:0.3s;">
                        <div style="font-size:52px;margin-bottom:16px;">🎮</div>
                        <div style="font-weight:600;font-size:15.5px;">${g.name}</div>
                    </div>
                `;
            });

            html += `</div>`;

            const id = 'tab-' + Date.now();
            currentTabs.push({id, url: 'data:text/html,' + encodeURIComponent(html), title: "Vault Arcade"});
            renderTabs();
            activateTab(id);
        }

        function init() {
            hideLoading();
            newTab();
        }

        window.onload = init;

        window.openInBrowser = openInBrowser;
        window.newTab = newTab;
        window.performSearch = performSearch;
        window.showHome = showHome;
        window.openVaultArcade = openVaultArcade;
    </script>
</body>
</html>
